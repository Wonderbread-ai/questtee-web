<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Questtee is coming soon.">
    <title>Questtee | Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#0D5257; --primary-dark:#073538; --gold:#FFD700; --light:#FAF9F6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Nunito',sans-serif; color:var(--primary-dark); text-align:center;
            min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:32px 16px;
            background:radial-gradient(circle at 50% 30%, #ffffff 0%, var(--light) 45%, #e4f1ee 100%);
        }
        img { max-width:min(560px,90vw); height:auto; }
        .pill {
            display:inline-block; margin:28px 0 14px; padding:6px 16px; border-radius:999px;
            background:rgba(13,82,87,.1); color:var(--primary); font-weight:800; font-size:14px; letter-spacing:.08em; text-transform:uppercase;
        }
        h1 { font-size:clamp(34px,6vw,56px); font-weight:900; color:var(--primary); line-height:1.1; }
        p { margin-top:14px; font-size:clamp(16px,2.4vw,20px); color:#444; max-width:34em; }
        .bar { margin-top:30px; width:120px; height:6px; border-radius:6px; background:var(--gold); }
        footer { margin-top:40px; font-size:13px; color:#777; }
        footer a { color:var(--primary); text-decoration:none; font-weight:700; }
    </style>
</head>
<body>
    <img src="images/logo-master.png" alt="Questtee">
    <span class="pill">Coming soon</span>
    <h1>Something good is on its way.</h1>
    <p>We're putting the finishing touches on Questtee. Check back soon.</p>
    <div class="bar"></div>
    <footer>Questions? <a href="mailto:support@questtee.com">support@questtee.com</a></footer>
</body>
</html>
